# Render Blueprint (task 7.1). In Render: New > Blueprint, pick this repository.
# NEXT_PUBLIC_* values are baked into the build, so set them BEFORE the first deploy (or redeploy after changing them).
services:
  - type: web
    name: flipbook-gift
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build   # devDependencies (TypeScript, Tailwind, esbuild) are needed to build
    startCommand: npm start                                # next start listens on Render's PORT by itself
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL                # Neon connection string
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: NEXT_PUBLIC_SITE_URL        # your public address, e.g. https://flipbook-gift.onrender.com (no trailing slash)
        sync: false
      - key: NEXT_PUBLIC_PUBLISH
        value: "1"
      - key: NEXT_PUBLIC_UPLOADS
        value: "1"
