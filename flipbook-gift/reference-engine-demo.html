*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:18px 14px 28px}

.envw>*{position:absolute}

</style></head><body>
<h1>Turn your feelings into a book they can touch.</h1>
<section id="env"><p style="margin:0;font:italic 500 19px 'Playfair Display',Georgia,serif;text-align:center">Someone has a special surprise for you.</p>
<div class="envw" id="ew"><div class="eb"></div><div class="card"><span style="font-size:12px;letter-spacing:.12em">FOR</span><b id="cr"></b><span id="cm"></span><span id="cs" style="font-size:13px"></span></div><div class="ef"></div><div class="fl"></div><div class="seal">❤</div></div>
<button id="ob">Open Your Gift ❤️</button></section>
<button id="cl" class="chip" aria-label="Close">✕</button>
<section id="book"><div class="bk"><canvas id="cv"></canvas></div>
<div class="nav"><button id="pv" aria-label="Previous page">‹</button><span id="pn"></span><button id="nx" aria-label="Next page">›</button></div>
<div class="note" id="hint">Drag a page corner with your finger or mouse.</div></section>
<div class="ctl"><span style="width:100%;text-align:center;color:var(--mut);font-size:12px">Sample controls (not part of the gift)</span>
<span id="chips"></span><input id="rn" value="Maya" aria-label="Recipient name"><input id="sn" value="Daniel" aria-label="Sender name"><button class="chip" id="rp">Replay envelope</button></div>
<div class="note">Demo: 3 of 10 templates, drawn on one Canvas page renderer. Every page has a photo (generated placeholders here).</div>

function scene(c,x,y,w,h,k){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,T.pal[k%3]);g.addColorStop(1,T.pal[(k+1)%3]);c.fillStyle=g;c.fillRect(x,y,w,h);

else{let s=fit(c,T.mast,T.df,W*.2);tx(c,T.mast,22,s+24,`${s}px ${T.df}`,T.ink);tx(c,T.issue,24,s+46,'600 10px '+B,T.ink);c.save();c.translate(W/2,H*.5);c.rotate(-.06);c.fillStyle='#fff';c.fillRect(-W*.38,-H*.27,W*.76,H*.5);scene(c,-W*.35,-H*.25,W*.7,H*.44,2);c.restore();c.fillStyle=T.ac;c.fillRect(0,H-96,W,96);T.cl.forEach((t,i)=>tx(c,t.toUpperCase(),22,H-60+i*24,'600 13px '+B,'#fff'))}},
(c,i)=>{c.fillStyle=T.paper;c.fillRect(0,0,W,H);const o=H*.26,fs=Math.max(12,Math.min(15,W*.036)),ce=T.v==1,x=ce?W/2:32,al=ce?'center':'left';scene(c,0,0,W,o,2);tx(c,"EDITOR'S LETTER",x,o+34,'600 11px '+B,T.ac,al);tx(c,f$(T.lh),x,o+70,`800 ${fs*1.8}px ${T.df}`,T.ink,al);c.fillStyle=T.ink;c.font=`400 ${fs}px `+B;c.textAlign=al;wrap(c,f$(T.letter),x,o+102,W-64,fs*1.55);tx(c,'— '+N.s,x,H-52,`italic 500 22px ${D1}`,T.ac,al);folio(c,i,T.ink)},
(c,i)=>{c.fillStyle=T.paper;c.fillRect(0,0,W,H);scene(c,0,0,W,H*.74,0+1);tx(c,'MOMENT',28,H*.74+34,'600 11px '+B,T.ac);c.fillStyle=T.ink;c.font=`italic 500 20px ${D1}`;c.textAlign='left';wrap(c,T.cap,28,H*.74+64,W-56,26);folio(c,i,T.ink)},
(c,i)=>{c.fillStyle=T.ac;c.fillRect(0,0,W,H);tx(c,'“',32,H*.24,`800 ${W*.26}px ${D1}`,'rgba(255,255,255,.4)');c.fillStyle='#fff';c.font=`700 ${W*.075}px ${T.df}`;c.textAlign='left';wrap(c,T.quote,32,H*.34,W-64,W*.1);c.save();c.shadowColor='#0005';c.shadowBlur=16;c.fillStyle='#fff';c.fillRect(28,H*.6-4,W-56,H*.25+8);c.restore();scene(c,32,H*.6,W-64,H*.25,0);tx(c,'— '+N.s+' to '+N.r,32,H-52,'600 12px '+B,'#fff');folio(c,i,'#fff')},
(c,i)=>{c.fillStyle=T.paper;c.fillRect(0,0,W,H);[[.3,.28,-.05,0],[.62,.62,.04,2]].forEach(([a,b,r,k])=>{c.save();c.translate(W*(.5+(a-.4)*.9),H*b*.9+30);c.rotate(r);c.shadowColor='#0004';c.shadowBlur=14;c.fillStyle='#fff';c.fillRect(-W*.3,-H*.17,W*.6,H*.34);c.shadowColor='transparent';scene(c,-W*.27,-H*.15,W*.54,H*.26,k+1);c.restore()});tx(c,T.cap,W/2,H-60,`italic 500 15px ${D1}`,T.ink,'center');folio(c,i,T.ink)},

const NP=P.length;
function build(){const r=$('.bk').clientWidth;W=r;H=Math.round(r*4/3);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
pg=P.map((fn,i)=>{const o=document.createElement('canvas');o.width=W*dpr;o.height=H*dpr;const c=o.getContext('2d');c.scale(dpr,dpr);fn(c,i);return o});draw();upd()}
const clip=(Q,mx,my,nx,ny,s)=>{const f=p=>s*((p[0]-mx)*nx+(p[1]-my)*ny),o=[];for(let i=0;i<Q.length;i++){const a=Q[i],b=Q[(i+1)%Q.length],fa=f(a),fb=f(b);if(fa>=0)o.push(a);if((fa>=0)!=(fb>=0)){const t=fa/(fa-fb);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}return o};
const path=(c,Q)=>{c.beginPath();Q.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath()};
function clampP(cx,cy,x,y){const ax=W-cx;let dx=x-ax,dy=y-cy,d=Math.hypot(dx,dy);if(d>W){x=ax+dx*W/d;y=cy+dy*W/d}const oy=H-cy,R=Math.hypot(W,H);dx=x-ax;dy=y-oy;d=Math.hypot(dx,dy);if(d>R){x=ax+dx*R/d;y=oy+dy*R/d}return[x,y]}
function draw(){const c=ctx;c.clearRect(0,0,W,H);if(!pg.length)return;if(!fold||Math.hypot(fold.cx-fold.px,fold.cy-fold.py)<2){c.drawImage(pg[idx],0,0,W,H);return}
const{cx,cy,px,py,dir}=fold;c.drawImage(pg[idx+dir],0,0,W,H);
const mx=(cx+px)/2,my=(cy+py)/2;let nx=cx-px,ny=cy-py;const L=Math.hypot(nx,ny);nx/=L;ny/=L;const R=[[0,0],[W,0],[W,H],[0,H]],cor=clip(R,mx,my,nx,ny,1),flat=clip(R,mx,my,nx,ny,-1);
c.save();path(c,cor);c.clip();let g=c.createLinearGradient(mx,my,mx+nx*70,my+ny*70);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();
c.save();path(c,flat);c.clip();c.drawImage(pg[idx],0,0,W,H);c.restore();
const d0=nx*mx+ny*my,FP=cor.map(p=>{const d=(p[0]-mx)*nx+(p[1]-my)*ny;return[p[0]-2*d*nx,p[1]-2*d*ny]});
c.save();path(c,FP);c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=22;c.shadowOffsetX=-nx*5;c.shadowOffsetY=-ny*5;c.fillStyle=T.paper;c.fill();c.restore();
c.save();path(c,FP);c.clip();c.transform(1-2*nx*nx,-2*nx*ny,-2*nx*ny,1-2*ny*ny,2*d0*nx,2*d0*ny);c.fillStyle='#f4efe6';c.fillRect(0,0,W,H);c.globalAlpha=.14;c.drawImage(pg[idx],0,0,W,H);c.restore();
c.save();path(c,FP);c.clip();g=c.createLinearGradient(mx,my,mx-nx*160,my-ny*160);g.addColorStop(0,'rgba(0,0,0,.3)');g.addColorStop(.35,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,W,H);c.restore()}
function anim(ms,f,done){const t0=performance.now();busy=true;(function s(n){const t=Math.min(1,(n-t0)/ms);f(1-Math.pow(1-t,3),t);draw();if(t<1)requestAnimationFrame(s);else{busy=false;done&&done()}})(t0)}
function upd(){$('#pn').textContent=(idx+1)+' / '+NP;$('#pv').disabled=idx==0;$('#nx').disabled=idx==NP-1}
function finish(dir,ok){fold=null;if(ok)idx+=dir;draw();upd()}
function turn(dir){if(busy||idx+dir<0||idx+dir>=NP)return;const cx=dir>0?W:0,cy=H,tx=cx+(W-2*cx)*-0.98*-1;fold={dir,cx,cy,px:cx,py:cy};const ax=W-cx,Tx=ax+(ax-cx)*.98;anim(750,t=>{const[x,y]=clampP(cx,cy,cx+(Tx-cx)*t,cy-Math.sin(Math.PI*t)*H*.22);fold.px=x;fold.py=y},()=>finish(dir,1))}
function hint(){if(busy)return;fold={dir:1,cx:W,cy:H,px:W,py:H};anim(1500,(t,r)=>{const s=Math.sin(Math.PI*r);fold.px=W-s*80;fold.py=H-s*70},()=>finish(1,0))}
cv.addEventListener('pointerdown',e=>{if(busy)return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;let dir=0;if(x>W*.5&&idx<NP-1)dir=1;else if(x<W*.3&&idx>0)dir=-1;if(!dir)return;const cx=dir>0?W:0,cy=y>H/2?H:0;drag={dir,sx:x,sy:y,cx,cy};fold={dir,cx,cy,px:cx,py:cy};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!drag)return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,[px,py]=clampP(drag.cx,drag.cy,drag.cx+x-drag.sx,drag.cy+y-drag.sy);fold.px=px;fold.py=py;draw()});
const rel=()=>{if(!drag)return;const{dir,cx,cy}=drag;drag=null;cv.style.cursor='grab';const ok=Math.hypot(cx-fold.px,cy-fold.py)>W*.38,ax=W-cx,tx2=ok?ax+(ax-cx)*.98:cx,ty=cy,x0=fold.px,y0=fold.py;anim(ok?420:300,t=>{fold.px=x0+(tx2-x0)*t;fold.py=y0+(ty-y0)*t},()=>finish(dir,ok))};
cv.addEventListener('pointerup',rel);cv.addEventListener('pointercancel',rel);
$('#nx').onclick=()=>turn(1);$('#pv').onclick=()=>turn(-1);
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')turn(1);if(e.key=='ArrowLeft')turn(-1)});
